        - name: destinationCurrency
          in: query
          required: true
          schema:
            type: string
            description: |
              The currency to convert to.
            enum: [ARS, BRL, KES, NGN, PHP, TZS, VND, ZAR, ZMW]
          example: USDC
        - name: paymentMethod
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MerchantMethodFx'
          example: paybill
        - name: optionalIssuerFee
          in: query
          required: true
          schema:
            type: string
