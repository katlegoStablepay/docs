  # ---------------------------------------------------------------------------
  # Payments
  # ---------------------------------------------------------------------------
  /v1/payments/in:
    post:
      operationId: submitMoneyin
      summary: Submit a money-in payment
      description: Submit a fiat-to-stablecoin payin.
      tags: [Payments]
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
          description: Client-generated UUID. Required to prevent duplicate payments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiatAmount, sourceCurrency, destinationCurrency, blockchain, paymentMethod, reference]
              properties:
                fiatAmount:
                  type: string
                  description: The payment amount in local currency.
                  example: "1000"
                sourceCurrency:
                  type: string
                  enum: [GHS, KES, NGN, TZS, UGX, ZMW, ZAR, XAF, XOF, CDF]
                  description: Fiat currency sent onchain for payment settlement.
                destinationCurrency:
                  type: string
                  enum: [USDC, USDT]
                  description: Stablecoin received by the recipient.
                blockchain:
                  type: string
                  enum: [BSC, SOLANA]
                  description: Supported blockchains for onchain settlement.
                paymentMethod:
                  type: string
                  enum: [MOMO, BANK]
                  description: The supported payment method used to deliver funds to the recipient.
                accountNumber:
                  type: string
                  description: |
                    The account number of the payment method.
                    Must be in E.164 format with the + prefix when paymentMethod is MOMO.
                  example: "+254712345678"
                accountName:
                  type: string
                  description: Recipient full name associated with the payment method. Required when paymentMethod is MOMO; optional otherwise.
                  example: "Jane Doe"
                paymentCode:
                  $ref: '#/components/schemas/PaymentCode'
                  description: |
                    Required when paymentMethod is MOMO or OPAY.
                    Available MOMO options: MPESA, MTN, AIRTEL, TIGO, ZAMTEL, HALOTEL, VODAFONE, VODACOM, ORANGE, MOOV, FREE.
                    Available BANK options: OPAY.
                reference:
                  type: string
                  description: Wallet issuer's unique reference.
                  example: "csh-txn-20260506-001"
                email:
                  type: string
                  format: email
                  description: Customer's email address. Required when paymentMethod is BANK; optional otherwise.
                  example: jane@example.com
                paymentIdentifier:
                  type: string
                  description: A method-specific identifier required for processing the payment. Examples include BVN (BANK) or other market specific references.
                customerId:
                  type: string
                  description: The customer this payment is for. Required when KYC is enabled for your account.
                  example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
            examples:
              kesMomo:
                summary: KES via M-Pesa
                value:
                  fiatAmount: "5000"
                  sourceCurrency: KES
                  destinationCurrency: USDC
                  blockchain: BSC
                  paymentMethod: MOMO
                  accountNumber: "+254712345678"
                  accountName: Jane Doe
                  paymentCode: MPESA
                  reference: order_abc123
              xafMomo:
                summary: XAF via Orange MoMo
                value:
                  fiatAmount: "300"
                  sourceCurrency: XAF
                  destinationCurrency: USDC
                  blockchain: SOLANA
                  paymentMethod: MOMO
                  accountNumber: "+237693329470"
                  accountName: tester
                  paymentCode: ORANGE
                  reference: order_xyz456
              ngnBankOpay:
                summary: NGN via OPAY deeplink
                value:
                  fiatAmount: "10000"
                  sourceCurrency: NGN
                  destinationCurrency: USDC
                  blockchain: BSC
                  paymentMethod: BANK
                  paymentCode: OPAY
                  email: jane@example.com
                  reference: order_ngn001
      responses:
        "202":
          description: |
            Payment accepted. The provider will collect fiat from the customer asynchronously.
            Listen for the `payment.succeeded` webhook for finality.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                    description: Use this ID to track the payment status.
                    example: pay_01HV8KZMRJPQR9S7T3XABCDEF
                  status:
                    type: string
                    example: provider_accepted
                  providerRef:
                    type: string
                    nullable: true
                    description: Provider's internal transaction ID.
                  # convertedAmount:
                  #   type: string
                  #   description: USDC amount that will be credited to the moneyin wallet after the spread is deducted.
                  #   example: "37.395"
                  depositInstruction:
                    allOf:
                      - $ref: '#/components/schemas/DepositInstruction'
                    nullable: true
                    description: |
                      For bank payins that require the customer to transfer fiat into a
                      provided account.
                  redirectUrl:
                    type: string
                    nullable: true
                    description: |
                      Hosted checkout URL the customer must be redirected to complete the
                      payment (e.g. OPAY deeplink). Null when not applicable.
                    example: "https://express.opaycheckout.com/apiCashier/redirect/payment/checkoutHome?orderToken=TOKEN.abc233f3nfonc8a0a076dd7"
                  createdAt:
                    type: string
                    format: date-time
                required: [paymentId, status, createdAt]
              example:
                paymentId: pay_01123KZMRJPQR9S7T3XABCDEF
                status: provider_accepted
                createdAt: "2023-11-07T05:31:56Z"
                providerRef: "<string>"
                redirectUrl: "https://express.opaycheckout.com/apiCashier/redirect/payment/checkoutHome?orderToken=TOKEN.abc233f3nfonc8a0a076dd7"
        "400":
          description: Validation error or missing idempotency-key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: |
            Unprocessable — blockchain/currency mismatch, unsupported corridor, or invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 422
                code: validation_error
                message: "KES requires blockchain=BSC (Honeycoin corridor)"

