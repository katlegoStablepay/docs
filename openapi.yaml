                moneyoutXaf:
                  summary: Money-out — XAF via MTN
                  value:
                    convertedAmount: "8.120"
                    exchangeRate: "622.500000"
                    paymentFee: "50"
                    expiresAt: "2024-01-15T10:31:00.000Z"
                moneyinGhs:
                  summary: Money-in — customer pays GHS, issuer receives USDC
                  value:
                    convertedAmount: "6.062"
                    exchangeRate: "12.866920"
                    paymentFee: "2"
                    expiresAt: "2024-01-15T10:31:30.000Z"
                moneyinXaf:
                  summary: Money-in — customer pays XAF, issuer receives USDC
                  value:
                    convertedAmount: "0.441"
                    exchangeRate: "666.600000"
                    paymentFee: "6"
                    expiresAt: "2024-01-15T10:31:00.000Z"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Validation error — invalid currency pair, unsupported corridor, or missing parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 422
                message: Moneyin is only supported for GHS, KES, NGN, TZS, UGX, ZMW, XAF, XOF, CDF.

  # ---------------------------------------------------------------------------
  # FX convert
  # ---------------------------------------------------------------------------
  /v1/fx/convert:
    get:
      operationId: fxConvert
      summary: Get a live FX rate (informational)
      description: |
        Returns a live indicative exchange rate and fee breakdown.
      tags: [FX]
      parameters:
        - name: amount
          in: query
          required: true
          schema:
            type: number
            example: 1000
          description: Amount to convert
        - name: sourceCurrency
          in: query
          required: true
          schema:
            type: string
            description: |
             The currency to convert from (fiat or stablecoin).
            enum: [CDF, GHS, KES, NGN, TZS, UGX, XAF, XOF, ZAR, ZMW, USDC, USDT]
          example: KES
        - name: destinationCurrency
          in: query
          required: true
          schema:
            type: string
            description: |
