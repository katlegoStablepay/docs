  # ---------------------------------------------------------------------------
  # Customers
  # ---------------------------------------------------------------------------
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: |
        The customers API is a KYC API for DeFi wallets. Onboard and verify your
        end-users, then link their wallet addresses so verified identity travels
        with their on-chain activity.

        Create a customer and start KYC. Returns a hosted verification URL.
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId:
                  type: string
                  description: Your own unique identifier for the customer.
                  example: user001
                type:
                  type: string
                  enum: [individual, business]
                email:
                  type: string
                  example: user@example.com
                phone:
                  type: string
                  example: "+254712345678"
                countryCode:
                  type: string
                  description: ISO 3166-1 alpha-2.
                  example: KE
                metadata:
                  type: object
                  description: Optional key-value data. Do not include personal information.
              required:
                - externalId
                - type
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: A customer with this externalId already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listCustomers
      summary: List customers
      description: List your customers, newest first.
      tags: [Customers]
      parameters:
        - name: kycStatus
          in: query
          required: false
          schema:
            type: string
          description: Filter by KYC status.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          example: 0
      responses:
        "200":
          description: A paginated list of customers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /v1/customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get a customer
      description: Retrieve a customer by ID.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: When true, fetches the live status and verified identity.
      responses:
        "200":
          description: Customer found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetResponse'
              example:
                id: cus_01...
                externalId: user001
                type: individual
                countryCode: KE
                kycStatus: review
                kycAttempts: 1
                riskLevel: null
                metadata: {}
                verifiedAt: null
                createdAt: "2023-11-07T05:31:56Z"
                updatedAt: "2023-11-07T05:31:56Z"
                identity: null
                reviewWarnings:
                  - code: COULD_NOT_PERFORM_AML_SCREENING
                    severity: error
                    feature: aml_screenings
                    message: Could not retrieve data from KYC for performing AML Screening.
        "404":
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateCustomer
      summary: Update a customer
      description: Update a customer's metadata.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
              required:
                - metadata
      responses:
        "200":
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        "404":
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/customers/{customerId}/verification:
    post:
      operationId: reverifyCustomer
      summary: Restart KYC verification for a customer
      description: |
        Start a new verification for a customer. Limited to three retries.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
          description: Customer ID for the existing customer whose KYC should be restarted.
      requestBody:
        required: true
        content:
          application/json:
            example: {}
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Optional corrected email address for the new verification session.
                  example: jane@example.com
                phone:
                  type: string
                  description: Optional corrected phone number for the new verification session.
                  example: "+254712345678"
                metadata:
                  type: object
                  example:
                    source: kyc_retry
                    reason: declined
      responses:
        "201":
          description: Verification started with a new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: cus_01KXG3R0X8DXTKB849FFFEPT7Y
                externalId: user001
                type: individual
                countryCode: KE
                kycStatus: in_progress
                kycAttempts: 2
                riskLevel: null
                metadata:
                  source: kyc_retry
                verifiedAt: null
                createdAt: "2024-01-15T10:31:00.000Z"
                updatedAt: "2024-01-15T10:35:00.000Z"
                verificationUrl: https://verify.didit.me/session/abcd1234
                sessionId: didit_session_abcd1234
        "429":
          description: Retry limit reached. This endpoint allows up to 3 additional retries beyond the initial attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 429
                message: KYC retry limit reached (3 retries). Contact support to reset.

  /v1/customers/{customerId}/wallets:
    post:
      operationId: linkCustomerWallet
      summary: Link a wallet
      description: Link an on-chain wallet address to a KYC-verified customer, so their verified identity travels with that wallet's on-chain activity.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
                  example: "0xAbC123..."
                  description: "The blockchain wallet address to link"
                blockchain:
                  $ref: '#/components/schemas/Blockchain'
              required:
                - walletAddress
                - blockchain
      responses:
        "201":
          description: Wallet linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWallet'
        "409":
          description: This address is already linked to a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listCustomerWallets
      summary: List wallets
      description: List a customer's linked wallets.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
      responses:
        "200":
          description: The customer's linked wallets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerWallet'

  /v1/customers/{customerId}/wallets/{walletId}:
    delete:
      operationId: unlinkCustomerWallet
      summary: Unlink a wallet
      description: Remove a wallet from a customer.
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_01KXG3R0X8DXTKB849FFFEPT7Y
        - name: walletId
          in: path
          required: true
          schema:
            type: string
          example: cus_wal_01KXG3R0X8DXTKB849FFFEPT7Y
      responses:
        "200":
          description: Wallet unlinked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        "404":
          description: Wallet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Webhooks — outbound management (tenant-facing)
  # ---------------------------------------------------------------------------
  /v1/webhooks/register:
    post:
      operationId: registerWebhook
      summary: Register a webhook endpoint
      description: |
        Register a URL to receive outbound event notifications.
        Pass an empty `events` array to subscribe to all event types.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: Your HTTPS endpoint that will receive POST requests.
                  example: https://app.walletIssuer.io/webhooks/stablepay
                events:
                  type: array
                  items:
                    type: string
                  description: Event types to subscribe to. Empty array = all events.
                  example: ["payment.succeeded", "payment.failed", "payment.processing", "customer.kyc.updated"]
              required: [url]
            example:
              url: https://app.walletIssuer.io/webhooks/stablepay
              events: ["payment.succeeded", "payment.failed", "payment.processing", "customer.kyc.updated"]
      responses:
        "201":
          description: Webhook registered. Save the `secret`. It is not retrievable after this response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookId:
                    type: string
                    format: uuid
                    description: Registration ID.
                  url:
                    type: string
                    format: uri
                  events:
                    type: array
                    items:
                      type: string
                  secret:
                    type: string
                    description: |
                      HMAC signing secret that is returned **once only**. Store in your secrets manager.
                      Used to verify `Stablepay-Signature` on inbound events.
                    example: "a3f7c2e1d4b8a0..."
                required: [webhookId, url, events, secret]

  /v1/webhooks/events:
    get:
      operationId: listWebhookEvents
      summary: List webhook events
      description: Paginated delivery event log for the authenticated tenant, newest first. Shows status, attempt count, and last error for each event.
      tags: [Webhooks]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Event log.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEventResponse'

  /v1/webhooks/replay/{event_id}:
    post:
      operationId: replayWebhookEvent
      summary: Replay a webhook event
      description: |
        Re-enqueue a failed webhook delivery for retry. Resets the attempt counter to 0.
        Useful when your endpoint was temporarily down and you want to re-deliver missed events.
      tags: [Webhooks]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID from the `GET /v1/webhooks/events` response.
      responses:
        "202":
          description: Event re-queued for delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: boolean
                    example: true
                  webhookOutboundId:
                    type: string
                    format: uuid
                required: [queued, webhookOutboundId]
        "404":
          description: Event not found or belongs to another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Health
    description: Service liveness check.
  - name: FX
    description: Live FX rate conversion between USDC and local fiat currencies.
  - name: Payments
    description: Submit and track stablecoin-to-fiat payout requests.
  - name: Balances
    description: Live on-chain USDC and native token balances for the tenant's custody wallets.
  - name: Analytics
    description: Pre-aggregated payment analytics — volume, success rates, corridor breakdowns, and daily time series.
  - name: Customers
    description: |
      KYC API for DeFi wallets. Onboard and verify your end-users, then link
      their wallet addresses so verified identity travels with their on-chain
      activity.
  - name: Webhooks
    description: Register endpoints and manage outbound event delivery.
  - name: Admin
    description: Ops-only endpoints for tenant management and payment operations. Requires an admin-scoped API key.
