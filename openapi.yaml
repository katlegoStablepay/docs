                value:
                  fiatAmount: 1350
                  sourceCurrency: USDC
                  destinationCurrency: KES
                  country: KE
                  blockchain: BSC
                  paymentMethod: MOMO
                  accountName: Jane Doe
                  accountNumber: "+254712345678"
                  paymentCode: MPESA
                  reference: csh-txn-20260506-001
              xafSolana:
                summary: XAF via MTN MoMo on Solana
                value:
                  fiatAmount: 5000
                  sourceCurrency: USDC
                  destinationCurrency: XAF
                  country: CM
                  blockchain: SOLANA
                  paymentMethod: MOMO
                  accountName: Jean Dupont
                  accountNumber: "+237612345678"
                  paymentCode: MTN
                  reference: csh-txn-20260506-002
      responses:
        "202":
          description: Payment accepted. Processing is async. Poll or await webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                    description: Use this ID to track the payment status.
                    example: pay_01HV8KZMRJPQR9S7T3XABCDEF
                  status:
                    type: string
                    example: provider_accepted
                  providerRef:
                    type: string
                    nullable: true
                    description: Provider's internal transaction ID.
                  # convertedAmount:
                  #   type: string
                  #   description: Fiat amount that will be paid to the recipient after fees are deducted.
                  #   example: "1350"
                  createdAt:
                    type: string
                    format: date-time
                required: [paymentId, status, createdAt]
        "400":
          description: Validation error (missing field or bad format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Idempotency key conflict — same key used with a different request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: |
            Insufficient on-chain USDC balance — the tenant's wallet holds less USDC than the
            payment requires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 422
                code: insufficient_balance
                message: "Insufficient balance on SOLANA: requested 10.500000 USDC, available 3.200000 USDC."
        "502":
          description: |
            Provider circuit breaker is open — the payment provider has experienced repeated
            failures and is temporarily unavailable. The response includes an estimated
            retry time. No payment record is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 502
                code: provider_unavailable
                message: "circuit open — retrying in ~45s"

